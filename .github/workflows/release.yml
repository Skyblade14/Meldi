name: Release

# Ein Tag vX.Y.Z baut das Windows-Paket und legt einen Release-Entwurf an. Veröffentlicht wird von Hand.
# Bei Änderungen am Installer (Pull Request oder main) läuft nur der Paketbau mit Rauchtest, damit er unter Windows geprüft
# ist, bevor das nächste Tag kommt.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: # gilt nicht für Tags, die lösen immer aus
      - tools/paket.py
      - deploy/**
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/release.yml
  pull_request:
    paths:
      - tools/paket.py
      - deploy/**
      - backend/pyproject.toml
      - backend/uv.lock
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  pruefen:
    name: Version und Herkunft
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # für den Vergleich mit main
          persist-credentials: false

      - name: Tag, Manifeste und Changelog
        run: python3 tools/paket.py pruefe-tag "$GITHUB_REF_NAME"

      - name: Commit liegt auf main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tests:
    name: Tests
    needs: pruefen
    uses: ./.github/workflows/tests.yml

  paket:
    name: Paket bauen und durchspielen
    needs: [pruefen, tests]
    # Ohne Tag sind die beiden Vorgänger übersprungen, das soll den Bau nicht verhindern.
    if: >-
      !cancelled() &&
      (github.ref_type != 'tag' || (needs.pruefen.result == 'success' && needs.tests.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Paket bauen
        run: uv run --no-project python tools/paket.py bauen --ausgabe paket

      - name: Rauchtest
        shell: bash
        run: uv run --no-project python tools/paket.py rauchtest paket/meldi-*-windows-x64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paket
          path: paket/meldi-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  veroeffentlichen:
    name: Release-Entwurf anlegen
    needs: paket
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Schreibrechte nur hier: Dieser Job führt keinen Build aus.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paket
          path: paket

      - name: Prüfsummen
        working-directory: paket
        run: sha256sum meldi-*-windows-x64.zip > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: paket/meldi-*-windows-x64.zip

      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/paket.py notizen "$GITHUB_REF_NAME" notizen.md
          vorab=""
          case "$GITHUB_REF_NAME" in *-rc.*) vorab="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" paket/meldi-*-windows-x64.zip paket/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag $vorab \
            --title "Meldi ${GITHUB_REF_NAME#v}" --notes-file notizen.md
